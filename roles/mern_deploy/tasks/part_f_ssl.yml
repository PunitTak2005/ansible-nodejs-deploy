---
# Part F — SSL/TLS with Let's Encrypt (Certbot)
# Covers: EPEL repo, Certbot + Nginx plugin install, conditional cert generation, timer check
- name: Install EPEL repository
  ansible.builtin.dnf:
    name: epel-release
    state: present

- name: Install Certbot and Nginx plugin
  ansible.builtin.dnf:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Check if SSL certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ domain_name }}/fullchain.pem"
  register: cert_check

- name: Issue SSL certificate with Certbot
  ansible.builtin.command: >
    certbot --nginx -d {{ domain_name }} -d www.{{ domain_name }}
    --non-interactive --agree-tos -m admin@{{ domain_name }} --redirect
  when: not cert_check.stat.exists
  register: certbot_issue_result
  changed_when: certbot_issue_result.rc == 0

- name: Confirm certbot renewal timer is active
  ansible.builtin.command: systemctl is-active certbot-renew.timer
  register: renew_timer_status
  changed_when: false
  failed_when: false

- name: Show renewal timer status
  ansible.builtin.debug:
    msg: "certbot-renew.timer status: {{ renew_timer_status.stdout }}"
