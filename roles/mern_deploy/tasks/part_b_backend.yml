---
# Part B — Backend Deployment
# Covers: clone repo, .env config, known-issue fixes (hardcoded localhost),
# npm install, PM2 process start
- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ ansible_user_id }}"
    mode: '0755'

- name: Clone application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_branch }}"
    force: yes
  register: git_clone_result

- name: Generate JWT secret
  ansible.builtin.command: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
  register: jwt_secret_result
  changed_when: false

- name: Set jwt_secret fact
  ansible.builtin.set_fact:
    jwt_secret: "{{ jwt_secret_result.stdout }}"

- name: Configure backend .env file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ app_dir }}/server/.env"
    mode: '0600'

# Known Issue: hardcoded localhost in CORS/Socket.io origin
- name: Fix hardcoded CORS/Socket.io origin in app.js
  ansible.builtin.replace:
    path: "{{ app_dir }}/server/app.js"
    regexp: "http://localhost:5173"
    replace: "process.env.CLIENT_URL"

# Known Issue: hardcoded localhost in Cloudinary fallback
- name: Fix hardcoded Cloudinary fallback URL
  ansible.builtin.replace:
    path: "{{ app_dir }}/server/lib/cloudinary.js"
    regexp: "http://localhost:3000/public/uploads/\\$\\{fileName\\}"
    replace: "${process.env.CLIENT_URL}/public/uploads/${fileName}"

- name: Install backend npm dependencies
  ansible.builtin.command: npm install
  args:
    chdir: "{{ app_dir }}/server"
  register: backend_npm_install
  changed_when: "'added' in backend_npm_install.stdout"

- name: Install and start backend with PM2
  block:
    - name: Install PM2 globally
      community.general.npm:
        name: pm2
        global: yes
        state: present

    - name: Start backend app with PM2
      ansible.builtin.command: pm2 start app.js --name society-backend
      args:
        chdir: "{{ app_dir }}/server"
      register: pm2_start_result
      changed_when: true

    - name: Save PM2 process list
      ansible.builtin.command: pm2 save
      changed_when: true

  rescue:
    - name: PM2 startup failed
      ansible.builtin.debug:
        msg: "PM2 failed to start the backend app. Check app.js and .env for errors."

  always:
    - name: PM2 setup step completed
      ansible.builtin.debug:
        msg: "PM2 backend setup step finished."
